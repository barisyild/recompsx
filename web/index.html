<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>recompsx</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0d12; color: #e8ecf3; }
    main { width: min(94vw, 980px); display: grid; gap: 14px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    h1 { margin: 0; font: 700 clamp(18px, 3vw, 28px)/1.2 system-ui, sans-serif; }
    button { border: 0; border-radius: 8px; padding: 10px 18px; font: inherit; cursor: pointer; background: #f4b942; color: #17130a; }
    button:disabled { cursor: wait; opacity: .65; }
    .screen { position: relative; aspect-ratio: 4 / 3; background: #000; border: 1px solid #292f3a; border-radius: 10px; overflow: hidden; box-shadow: 0 24px 80px #0009; }
    #frameinfo { position: absolute; left: 8px; top: 8px; padding: 2px 8px; border-radius: 4px; background: #000b; color: #ffd76a; font: 600 14px/1.4 ui-monospace, Menlo, monospace; pointer-events: none; }
    /* The machine's pointer over the picture, while a mod has turned the mouse on: the same
       16 x 24 art the Dreamcast draws (src/backend/api/pointer_art.h), tip at 0 0, and twice the
       size where a CSS pixel is two device pixels. The runtime adds the class, and sets
       `cursor: none` while a pad is in use (ADR-0038). */
    .screen.pointer { cursor: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAYCAYAAADzoH0MAAAAmklEQVR42qXUwQ2AIAwFUEbh4EaO4Cie9Ow0uAvOIRcNJphKSvmtJA0JgZfSFJz3w5XDWUcBzEg+mNJ5jdNqQ/KhI0Y7UoAQ9mdWIxQwITWgRjhAhbQAGJEACOkBXQQBRAQFmogGYJEeMC8bGy+CAPTF1sECWa8BuA9KajUI9QHdSJEu8CkKWYeykL40OAupPnAtEOTXv9m65g1iKifH7MkowAAAAABJRU5ErkJggg==) 0 0, default;
      cursor: -webkit-image-set(url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAYCAYAAADzoH0MAAAAmklEQVR42qXUwQ2AIAwFUEbh4EaO4Cie9Ow0uAvOIRcNJphKSvmtJA0JgZfSFJz3w5XDWUcBzEg+mNJ5jdNqQ/KhI0Y7UoAQ9mdWIxQwITWgRjhAhbQAGJEACOkBXQQBRAQFmogGYJEeMC8bGy+CAPTF1sECWa8BuA9KajUI9QHdSJEu8CkKWYeykL40OAupPnAtEOTXv9m65g1iKifH7MkowAAAAABJRU5ErkJggg==) 1x, url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAwCAYAAABwrHhvAAAAwElEQVR42t3YQQqAIBAFUI/Soht1hI7Sqtadxu5S56hNgSBEMZg5jvMV/kKQeDSWOKZp2vMeIz3UAcQhagDHsbt0/eQiBlED2NbVRRyiDmDt4uLn2SFqAWIQ9YDsEBhANggcgB0CC2CDwAOSIdUAfkOqA0RDqgV8hsADhnGOygtSDYC64oWCA/CvLgTIdhwXAzw3TQjIfhwXA1APpCD4APJHQaxnK4UaQGyTiq0UxQGpNyr2zxIGoL4UxfqNcD3nC76InxkmNDjFAAAAAElFTkSuQmCC) 2x) 0 0, default; }
    canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; object-fit: contain; }
    canvas[hidden] { display: none; }
    #screen-gl { object-fit: fill; }
    label { font-size: 13px; color: #aab3c2; display: flex; align-items: center; gap: 6px; }
    #status { min-height: 1.4em; color: #aab3c2; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>recompsx JS</h1>
      <label><input type="checkbox" id="hw" checked> WebGL rendering</label>
      <label><input type="checkbox" id="audio" checked> Sound</label>
      <label><input type="checkbox" id="pace" checked> Speed limit</label>
      <button id="start">Start game</button>
    </header>
    <div class="screen"><canvas id="screen" width="640" height="480"></canvas><canvas id="screen-gl" hidden></canvas><div id="frameinfo" hidden></div></div>
    <div id="status">Press the button to start.</div>
    <small id="build"></small>
    <!--
      LOGS GO TO THE BROWSER CONSOLE, NEVER INTO THE PAGE. The runtime writes hundreds of lines a
      second while the game boots; writing them into an element re-renders the page on every line
      and slows the game. Open the developer console to read them (an agent reads them with its
      console tool). Do not add a log element back.
    -->
  </main>
  <script>
    const start = document.querySelector('#start');
    const status = document.querySelector('#status');
    const canvas = document.querySelector('#screen');
    const glCanvas = document.querySelector('#screen-gl');
    const hwBox = document.querySelector('#hw');
    const audioBox = document.querySelector('#audio');
    const paceBox = document.querySelector('#pace');
    // Without the Web Audio API the game still runs, silent: the box is cleared as if Sound had
    // been switched off, and startAudio treats a context it cannot make the same way.
    if (typeof AudioContext !== 'function') {
      audioBox.checked = false; audioBox.disabled = true; audioBox.parentElement.title = 'No AudioContext';
    }
    // Live: the loop reads host.unpaced every tick. Off, it runs as many frames as fit in a
    // display interval — for profiling and for seeing what the machine can do, not for playing.
    paceBox.addEventListener('change', () => {
      if (globalThis.recompsxHost) globalThis.recompsxHost.unpaced = !paceBox.checked;
    });
    // The WebGL2 renderer draws the PlayStation's primitives itself (gpu-webgl.js). Offered only
    // where WebGL2 exists; the software rasteriser and the 2D canvas remain the fallback.
    let renderer = null;
    // Loaded under the renderer's own version from build.json: it changes without game.js
    // changing, and a static tag let a browser pair a cached old renderer with a new build.
    // A build.json without one gets a fresh copy every time.
    let rendererLoaded = null;
    function loadRenderer(version) {
      if (rendererLoaded) return rendererLoaded;
      rendererLoaded = new Promise(resolve => {
        const script = document.createElement('script');
        script.src = `gpu-webgl.js?v=${encodeURIComponent(version || Date.now())}`;
        script.onload = script.onerror = () => {
          if (!(typeof createHardwareGpu === 'function') || !glCanvas.getContext('webgl2')) {
            hwBox.checked = false; hwBox.disabled = true; hwBox.parentElement.title = 'No WebGL2';
          }
          resolve();
        };
        document.head.appendChild(script);
      });
      return rendererLoaded;
    }
    const ctx = canvas.getContext('2d', { alpha: false });
    const frame = document.createElement('canvas');
    const frameCtx = frame.getContext('2d', { alpha: false });
    const audioQueue = [];
    let queuedFrames = 0;
    let audioContext;
    let image;
    let buildInfo;
    fetch('build.json', { cache: 'no-store' }).then(r => {
      if (!r.ok) throw new Error('Build first with scripts/build-web.sh.');
      return r.json();
    }).then(info => {
      buildInfo = info;
      // Safari and every iOS browser run an insecure page without their optimising JIT — about
      // a ninth of the speed (docs/WEB.md). http://localhost is secure; a LAN address is not.
      document.querySelector('#build').textContent = `Build ${info.version}` + (window.isSecureContext ? ''
        : ' · not a secure context: WebKit runs this page without its JIT — open it over https (scripts/serve-https.py)');
      document.querySelector('h1').textContent = `${info.title} · recompsx JS`;
      document.title = `recompsx — ${info.title}`;
      loadRenderer(info.renderer);
    }).catch(error => { status.textContent = error.message; loadRenderer(); });

    // Logs go to the browser console only — see the note in the markup. Writing them into the
    // page re-rendered it on every line, and the runtime writes hundreds a second at boot.
    function writeLog(line) { console.log(line); }

    // Revalidated on every load: boot.exe and disc.bin are the user's files, and pointing them at
    // another game must not leave the browser's copy of the last one in play (the dev server
    // answers a still-matching copy with a 304, so the disc is not fetched again for nothing).
    async function fetchBytes(path, label) {
      const response = await fetch(path, { cache: 'no-cache' });
      if (!response.ok) throw new Error(`Could not load ${label}: HTTP ${response.status}`);
      const total = Number(response.headers.get('content-length')) || 0;
      if (!response.body || !total) return new Uint8Array(await response.arrayBuffer());
      const out = new Uint8Array(total);
      const reader = response.body.getReader();
      let offset = 0;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        out.set(value, offset);
        offset += value.length;
        status.textContent = `Loading ${label}: ${Math.floor(offset * 100 / total)}%`;
      }
      return out;
    }

    // Sound goes to an AudioWorklet (audio-worklet.js): the SPU's frames are transferred to the
    // rendering thread, which plays them and reports what it still holds. The deprecated
    // ScriptProcessorNode remains only as a fallback for a browser without worklets.
    let audioNode = null;
    // The worklet reports its queue every 23 ms or so and the SPU asks far more often; between
    // reports the answer is the last report less what the rendering thread has consumed since,
    // at 44.1 frames a millisecond, plus what was pushed in the meantime.
    let reportedFrames = 0, reportedAt = 0, pushedSinceReport = 0;
    // Batches pushed during one tick travel to the worklet in one message at the tick's end
    // (from `progress`): the SPU pushes 344 times a second and a message each cost more than
    // the sound. A tick's worth is under 16 ms of audio, well inside the queue's slack.
    // The runtime lends its output buffer for the length of the call (see audioLend); what is
    // kept is copied into this page-owned array, so a push allocates nothing and a tick makes
    // one buffer, the one it transfers. A copy per push and a slice per push before it were a
    // steady share of the garbage, and the share grew with the frame rate.
    let audioPending = new Int16Array(1 << 15);
    let audioPendingSamples = 0;
    let lentBytes = null, lentSamples = null;
    function flushAudio() {
      if (!audioNode || audioPendingSamples === 0) return;
      const merged = audioPending.slice(0, audioPendingSamples);
      audioPendingSamples = 0;
      audioNode.port.postMessage(merged.buffer, [merged.buffer]);
    }
    // The status line is DOM: written per tick it forced a layout each time (2 % of a frame in
    // the profile, and as much again in layout). Four times a second is plenty to read.
    let shownFrames = -15;
    let shownAt = 0;
    let presentedAt = 0;

    // Finding a frame (web/AGENTS.md). ?slow=auto plays 300 frames in slow motion from every copy
    // of the picture on screen the WebGL renderer makes (a level transition, ADR-0054);
    // ?slow=A-B,C-D plays those frames so; ?slowfps=N is how slow (10 by default); ?ff=N runs with
    // the speed limit off until frame N. Any of them, or ?frames, puts the frame number on the
    // picture — the vblank --pad-script counts — and gives two keys: "," slow motion on and off,
    // "." one frame on while paused.
    const query = new URLSearchParams(location.search);
    const slowSpec = query.getAll('slow').join(',');
    const slowAuto = /(^|,)auto(,|$)/.test(slowSpec);
    const slowRanges = slowSpec.split(',').map(r => r.match(/^(\d+)-(\d+)$/)).filter(Boolean)
      .map(m => [+m[1], +m[2]]);
    const slowFps = Math.max(1, +(query.get('slowfps') || 10));
    const ffUntil = +(query.get('ff') || 0);
    const frameDebug = slowAuto || slowRanges.length > 0 || ffUntil > 0 || query.has('frames');
    const frameInfo = document.querySelector('#frameinfo');
    let frameNo = 0, slowUntil = -1, slowManual = false, seenCopies = 0, stepTo = -1;
    let userPaused = false, slowTimer = 0;
    // Once a vblank, before anything else the page does with the picture.
    function debugFrame(host) {
      frameNo++;
      const copies = host.gpu ? host.gpu.copies | 0 : 0;
      if (slowAuto && copies !== seenCopies) slowUntil = frameNo + 300;
      seenCopies = copies;
      // Nothing is slowed while fast-forwarding: ?ff skips to where the looking starts.
      const slow = frameNo >= ffUntil && (slowManual || frameNo <= slowUntil
        || slowRanges.some(r => frameNo >= r[0] && frameNo <= r[1]));
      if (ffUntil > 0 && frameNo <= ffUntil) host.unpaced = frameNo < ffUntil || !paceBox.checked;
      if (stepTo >= 0 && frameNo >= stepTo) { stepTo = -1; host.paused = true; }
      else if (slow && !userPaused && !slowTimer) {
        host.paused = true;
        slowTimer = setTimeout(() => { slowTimer = 0; if (!userPaused) host.paused = false; }, 1000 / slowFps);
      }
      frameInfo.textContent = 'frame ' + frameNo + (userPaused ? ' · paused' : (slow ? ' · slow' : ''));
    }
    if (frameDebug) {
      frameInfo.hidden = false;
      frameInfo.textContent = 'frame 0';
      addEventListener('keydown', (e) => {
        const host = globalThis.recompsxHost;
        if (!host || e.repeat) return;
        if (e.key === ',') slowManual = !slowManual;
        else if (e.key === '.' && userPaused) { stepTo = frameNo + 1; host.paused = false; }
      });
    }
    function workletBuffered() {
      const drained = (performance.now() - reportedAt) * 44.1;
      return Math.max(0, Math.round(reportedFrames - drained + pushedSinceReport));
    }
    async function startAudio() {
      // No context, no sound: audioContext stays null, which is what tells the runtime --no-audio.
      try {
        audioContext = new AudioContext({ sampleRate: 44100, latencyHint: 'interactive' });
      } catch (error) {
        writeLog(`[audio] no AudioContext (${error.message}); running without sound`);
        audioContext = null;
        audioBox.checked = false;
        return;
      }
      if (audioContext.audioWorklet) {
        try {
          await audioContext.audioWorklet.addModule('audio-worklet.js');
          audioNode = new AudioWorkletNode(audioContext, 'recompsx-audio',
            { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2] });
          audioNode.port.onmessage = event => {
            reportedFrames = event.data; reportedAt = performance.now(); pushedSinceReport = 0;
          };
          audioNode.connect(audioContext.destination);
          return;
        } catch (error) {
          writeLog(`[audio] worklet failed to load (${error.message}); using ScriptProcessorNode`);
          audioNode = null;
        }
      }
      const node = audioContext.createScriptProcessor(2048, 0, 2);
      node.onaudioprocess = event => {
        const left = event.outputBuffer.getChannelData(0);
        const right = event.outputBuffer.getChannelData(1);
        left.fill(0); right.fill(0);
        let at = 0;
        while (at < left.length && audioQueue.length) {
          const item = audioQueue[0];
          const available = item.frames - item.at;
          const take = Math.min(left.length - at, available);
          for (let i = 0; i < take; i++) {
            left[at + i] = item.samples[(item.at + i) * 2] / 32768;
            right[at + i] = item.samples[(item.at + i) * 2 + 1] / 32768;
          }
          item.at += take; at += take; queuedFrames -= take;
          if (item.at === item.frames) audioQueue.shift();
        }
      };
      node.connect(audioContext.destination);
    }

    start.addEventListener('click', async () => {
      if (globalThis.recompsxHost) {
        const host = globalThis.recompsxHost;
        // The player's pause, apart from slow motion's (debugFrame), which pauses between frames.
        userPaused = !userPaused;
        host.paused = userPaused;
        start.textContent = host.paused ? 'Resume' : 'Pause';
        if (frameDebug) frameInfo.textContent = 'frame ' + frameNo + (userPaused ? ' · paused' : '');
        if (host.paused) {
          audioQueue.length = 0; queuedFrames = 0;
          audioPendingSamples = 0;
          reportedFrames = 0; reportedAt = performance.now(); pushedSinceReport = 0;
          if (audioNode) audioNode.port.postMessage('flush');
        }
        status.textContent = host.paused ? 'Paused' : 'Resuming…';
        return;
      }
      start.disabled = true;
      try {
        if (!buildInfo) {
          const response = await fetch('build.json', { cache: 'no-store' });
          if (!response.ok) throw new Error('No browser build found.');
          buildInfo = await response.json();
        }
        // Off, the SPU still advances every voice (a game reads ENDX and the envelopes) but
        // mixes nothing and no AudioContext is created — the runtime is told with --no-audio.
        audioBox.disabled = true;
        if (audioBox.checked) await startAudio();
        const boot = await fetchBytes('boot.exe', 'PS-EXE');
        const disc = await fetchBytes('disc.bin', 'disc image');
        status.textContent = 'Starting the game…';

        await loadRenderer(buildInfo.renderer);
        hwBox.disabled = true;
        if (hwBox.checked) {
          try { renderer = createHardwareGpu(glCanvas); }
          catch (error) { writeLog(`[webgl] ${error.message}; falling back to software rendering`); renderer = null; }
        }
        if (renderer) { canvas.hidden = true; glCanvas.hidden = false; }

        globalThis.recompsxHost = {
          // Launch parameters from the page's address as well, one `arg` each, for a run that must
          // reach one place every time: ?arg=--pad-script&arg=4700:CROSS,4710:- (sio.PadScript).
          args: ['boot.exe', 'disc.bin']
            .concat(renderer ? ['--video-hw'] : [])
            .concat(audioContext ? [] : ['--no-audio'])
            .concat(new URLSearchParams(location.search).getAll('arg')),
          files: { 'boot.exe': boot, 'disc.bin': disc },
          paused: false,
          unpaced: !paceBox.checked,
          gpu: renderer,
          // The element the picture fills, whichever canvas draws it: the pointer is read over it
          // as the HLE kernel's mouse (shim.Input, ADR-0038).
          screen: document.querySelector('.screen'),
          present(vram, sx, sy, width, height, flags) {
            if (frameDebug) debugFrame(this);
            // Fast-forwarding, every emulated vblank still arrives here; one picture per display
            // interval is all a viewer can see, so the rest are skipped before any blit.
            if (this.unpaced) {
              const now = performance.now();
              if (now - presentedAt < 15) return;
              presentedAt = now;
            }
            if (renderer) { renderer.present(vram, sx, sy, width, height, flags); return; }
            if (width <= 0 || height <= 0) {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              return;
            }
            if (!image || image.width !== width || image.height !== height) {
              frame.width = width; frame.height = height;
              image = frameCtx.createImageData(width, height);
            }
            const rgba = image.data;
            const rgb24 = (flags & 1) !== 0;
            let out = 0;
            for (let y = 0; y < height; y++) {
              const row = ((sy + y) & 511) * 2048;
              for (let x = 0; x < width; x++) {
                const at = (sx * 2 + x * (rgb24 ? 3 : 2)) & 2047;
                if (rgb24) {
                  rgba[out++] = vram[row + at];
                  rgba[out++] = vram[row + ((at + 1) & 2047)];
                  rgba[out++] = vram[row + ((at + 2) & 2047)];
                } else {
                  const v = vram[row + at] | (vram[row + ((at + 1) & 2047)] << 8);
                  const r = v & 31, g = (v >> 5) & 31, b = (v >> 10) & 31;
                  rgba[out++] = (r << 3) | (r >> 2);
                  rgba[out++] = (g << 3) | (g >> 2);
                  rgba[out++] = (b << 3) | (b >> 2);
                }
                rgba[out++] = 255;
              }
            }
            frameCtx.putImageData(image, 0, 0);
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);
          },
          // `bytes` is the runtime's own buffer, lent for the call, and `byteLength` how much of
          // it this batch is. (`audioPush(bytes)`, a copy per batch, is what older bundles call.)
          audioLend(bytes, byteLength) {
            if (!audioContext) return;
            if (bytes !== lentBytes) {
              lentBytes = bytes;
              lentSamples = new Int16Array(bytes.buffer, bytes.byteOffset, bytes.byteLength >> 1);
            }
            const count = (byteLength === undefined ? bytes.byteLength : byteLength) >> 1;
            const frames = count >> 1;
            if (audioNode) {
              if (audioPendingSamples + count > audioPending.length) {
                const grown = new Int16Array(Math.max(audioPending.length * 2, audioPendingSamples + count));
                grown.set(audioPending.subarray(0, audioPendingSamples));
                audioPending = grown;
              }
              for (let i = 0; i < count; i++) audioPending[audioPendingSamples + i] = lentSamples[i];
              audioPendingSamples += count;
              pushedSinceReport += frames;
              return;
            }
            const copy = lentSamples.slice(0, count);
            audioQueue.push({ samples: copy, frames, at: 0 });
            queuedFrames += frames;
            while (queuedFrames > 11025 && audioQueue.length > 1) {
              const dropped = audioQueue.shift();
              queuedFrames -= dropped.frames - dropped.at;
            }
          },
          audioPush(bytes) { this.audioLend(bytes, bytes.byteLength); },
          audioBuffered() { return audioNode ? workletBuffered() : (audioContext ? queuedFrames : 0); },
          state(value) {
            start.disabled = value !== 'running';
            start.textContent = value === 'running' ? 'Pause' : 'Start game';
            if (value === 'error') status.textContent = 'The game stopped with an error; details are in the browser console.';
            else if (value === 'stopped') status.textContent = 'The game stopped.';
          },
          progress(frames, yields) {
            flushAudio();
            // At most twice a second, whatever the frame rate: a status write re-lays the page.
            const now = performance.now();
            if (now - shownAt < 500) return;
            const fps = shownAt > 0 ? Math.round((frames - shownFrames) * 1000 / (now - shownAt)) : 0;
            shownAt = now; shownFrames = frames;
            status.textContent = `${frames} frames · ${fps} fps · running`;
            status.dataset.frames = frames;
            status.dataset.yields = yields;
          },
          log(level, line) { writeLog(line); },
          // The backend's storage (bp_storage_*): the console's settings (system.cfg), kept in this
          // browser under the page's origin. A blob past 256 KB — the one-off VRAM dump — is only
          // reported.
          storageRead(name, into) {
            let text = null;
            try { text = localStorage.getItem('recompsx:' + name); } catch (error) { return -1; }
            if (text === null) return -1;
            const raw = atob(text);
            const n = Math.min(raw.length, into.length);
            for (let i = 0; i < n; i++) into[i] = raw.charCodeAt(i);
            return n;
          },
          storageWrite(name, bytes) {
            if (bytes.length > 262144) { writeLog(`[file] ${name}: ${bytes.length} bytes, not kept`); return; }
            let raw = '';
            for (let i = 0; i < bytes.length; i += 0x8000) raw += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
            try { localStorage.setItem('recompsx:' + name, btoa(raw)); writeLog(`[file] ${name}: ${bytes.length} bytes kept`); }
            catch (error) { writeLog(`[file] ${name}: not kept (${error.message})`); }
          },
          // Memory cards (bp_card_*, ADR-0037): each game's card under its product code, in the
          // card format the runtime builds — a header and the blocks its saves occupy, so a
          // one-block game keeps 8 KB here, and a game with nothing saved keeps nothing.
          cardLoad(game, into) {
            let text = null;
            try { text = localStorage.getItem(`recompsx:card:${game}`); } catch (error) { return -1; }
            if (text === null) return -1;
            const raw = atob(text);
            if (raw.length > into.length) return -1;
            for (let i = 0; i < raw.length; i++) into[i] = raw.charCodeAt(i);
            return raw.length;
          },
          cardSave(game, title, bytes) {
            const key = `recompsx:card:${game}`;
            try {
              if (bytes.length <= 16) { localStorage.removeItem(key); writeLog(`[card] ${title}: nothing saved, nothing kept`); return 0; }
              let raw = '';
              for (let i = 0; i < bytes.length; i += 0x8000) raw += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
              localStorage.setItem(key, btoa(raw));
            } catch (error) { writeLog(`[card] ${title}: not kept (${error.message})`); return -1; }
            writeLog(`[card] ${title}: ${bytes.length} bytes kept`);
            return 0;
          },
          // The i-mode adaptor's phone on the network (bp_http_*, ADR-0040): the request comes raw,
          // origin-form with a Host header, and goes out as fetch(); the answer goes back raw, as
          // an HTTP/1.0 server would send it. The server has to allow this page's origin (CORS),
          // and a page served over https can reach https only.
          httpOpen(host, port, bytes) {
            const text = new TextDecoder('latin1').decode(bytes);
            const end = text.indexOf('\r\n\r\n');
            const head = (end < 0 ? text : text.slice(0, end)).split('\r\n');
            const [method, path] = head[0].split(' ');
            const headers = new Headers();
            for (const line of head.slice(1)) {
              const colon = line.indexOf(':');
              const name = colon < 0 ? '' : line.slice(0, colon).trim();
              if (name && !/^(host|content-length|connection|user-agent)$/i.test(name)) {
                try { headers.append(name, line.slice(colon + 1).trim()); } catch (error) {}
              }
            }
            const body = end < 0 || /^(GET|HEAD)$/i.test(method) ? undefined : bytes.slice(end + 4);
            const id = (this.nextHttp = (this.nextHttp || 0) + 1);
            const exchange = { data: new Uint8Array(0), done: false, failed: false };
            (this.http = this.http || new Map()).set(id, exchange);
            const url = `${location.protocol === 'https:' ? 'https' : 'http'}://${host}${port === 80 ? '' : ':' + port}${path}`;
            fetch(url, { method, headers, body }).then(async (response) => {
              const content = new Uint8Array(await response.arrayBuffer());
              let status = `HTTP/1.0 ${response.status} ${response.statusText || ''}\r\n`;
              response.headers.forEach((value, name) => {
                if (!/^(content-length|content-encoding|transfer-encoding|connection)$/i.test(name)) status += `${name}: ${value}\r\n`;
              });
              status += `Content-Length: ${content.length}\r\n\r\n`;
              const all = new Uint8Array(status.length + content.length);
              for (let i = 0; i < status.length; i++) all[i] = status.charCodeAt(i) & 0xFF;
              all.set(content, status.length);
              exchange.data = all;
              exchange.done = true;
            }).catch((error) => {
              writeLog(`[net] ${method} ${url}: ${error.message}`);
              exchange.failed = true;
            });
            return id;
          },
          httpRead(handle, into) {
            const exchange = this.http && this.http.get(handle);
            if (!exchange || exchange.failed) return -2;
            if (exchange.data.length > 0) {
              const n = Math.min(into.length, exchange.data.length);
              into.set(exchange.data.subarray(0, n));
              exchange.data = exchange.data.subarray(n);
              return n;
            }
            return exchange.done ? -1 : 0;
          },
          httpClose(handle) {
            if (this.http) this.http.delete(handle);
          },
          // A game's QUIT (bp_exit_to_menu): the page's own start screen. The memory card is
          // already in local storage; loading the page again drops the running machine whole.
          exitToMenu() {
            writeLog('[menu] the game quit: back to the start screen');
            location.reload();
          }
        };
        const script = document.createElement('script');
        script.src = `game.js?v=${encodeURIComponent(buildInfo.version)}`;
        script.onerror = () => {
          status.textContent = 'Error: could not load game.js';
          start.disabled = false;
        };
        document.body.appendChild(script);
      } catch (error) {
        status.textContent = `Error: ${error.message}`;
        writeLog(error.stack || String(error));
        start.disabled = false;
      }
    });
  </script>
</body>
