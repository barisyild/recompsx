<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>recompsx</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0d12; color: #e8ecf3; }
    main { width: min(94vw, 980px); display: grid; gap: 14px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    h1 { margin: 0; font: 700 clamp(18px, 3vw, 28px)/1.2 system-ui, sans-serif; }
    button { border: 0; border-radius: 8px; padding: 10px 18px; font: inherit; cursor: pointer; background: #f4b942; color: #17130a; }
    button:disabled { cursor: wait; opacity: .65; }
    .screen { aspect-ratio: 4 / 3; background: #000; border: 1px solid #292f3a; border-radius: 10px; overflow: hidden; box-shadow: 0 24px 80px #0009; }
    canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; object-fit: contain; }
    canvas[hidden] { display: none; }
    #screen-gl { object-fit: fill; }
    label { font-size: 13px; color: #aab3c2; display: flex; align-items: center; gap: 6px; }
    #status { min-height: 1.4em; color: #aab3c2; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>recompsx JS</h1>
      <label><input type="checkbox" id="hw" checked> WebGL rendering</label>
      <label><input type="checkbox" id="audio" checked> Sound</label>
      <label><input type="checkbox" id="pace" checked> Speed limit</label>
      <button id="start">Start game</button>
    </header>
    <div class="screen"><canvas id="screen" width="640" height="480"></canvas><canvas id="screen-gl" hidden></canvas></div>
    <div id="status">Press the button to start.</div>
    <small id="build"></small>
    <!--
      LOGS GO TO THE BROWSER CONSOLE, NEVER INTO THE PAGE. The runtime writes hundreds of lines a
      second while the game boots; writing them into an element re-renders the page on every line
      and slows the game. Open the developer console to read them (an agent reads them with its
      console tool). Do not add a log element back.
    -->
  </main>
  <script src="gpu-webgl.js"></script>
  <script>
    const start = document.querySelector('#start');
    const status = document.querySelector('#status');
    const canvas = document.querySelector('#screen');
    const glCanvas = document.querySelector('#screen-gl');
    const hwBox = document.querySelector('#hw');
    const audioBox = document.querySelector('#audio');
    const paceBox = document.querySelector('#pace');
    // Live: the loop reads host.unpaced every tick. Off, it runs as many frames as fit in a
    // display interval — for profiling and for seeing what the machine can do, not for playing.
    paceBox.addEventListener('change', () => {
      if (globalThis.recompsxHost) globalThis.recompsxHost.unpaced = !paceBox.checked;
    });
    // The WebGL2 renderer draws the PlayStation's primitives itself (gpu-webgl.js). Offered only
    // where WebGL2 exists; the software rasteriser and the 2D canvas remain the fallback.
    let renderer = null;
    if (!(typeof createHardwareGpu === 'function') || !glCanvas.getContext('webgl2')) {
      hwBox.checked = false; hwBox.disabled = true; hwBox.parentElement.title = 'No WebGL2';
    }
    const ctx = canvas.getContext('2d', { alpha: false });
    const frame = document.createElement('canvas');
    const frameCtx = frame.getContext('2d', { alpha: false });
    const audioQueue = [];
    let queuedFrames = 0;
    let audioContext;
    let image;
    let buildInfo;
    fetch('build.json', { cache: 'no-store' }).then(r => {
      if (!r.ok) throw new Error('Build first with scripts/build-web.sh.');
      return r.json();
    }).then(info => {
      buildInfo = info;
      document.querySelector('#build').textContent = `Build ${info.version}`;
      document.querySelector('h1').textContent = `${info.title} · recompsx JS`;
      document.title = `recompsx — ${info.title}`;
    }).catch(error => { status.textContent = error.message; });

    // Logs go to the browser console only — see the note in the markup. Writing them into the
    // page re-rendered it on every line, and the runtime writes hundreds a second at boot.
    function writeLog(line) { console.log(line); }

    async function fetchBytes(path, label) {
      const response = await fetch(path);
      if (!response.ok) throw new Error(`Could not load ${label}: HTTP ${response.status}`);
      const total = Number(response.headers.get('content-length')) || 0;
      if (!response.body || !total) return new Uint8Array(await response.arrayBuffer());
      const out = new Uint8Array(total);
      const reader = response.body.getReader();
      let offset = 0;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        out.set(value, offset);
        offset += value.length;
        status.textContent = `Loading ${label}: ${Math.floor(offset * 100 / total)}%`;
      }
      return out;
    }

    // Sound goes to an AudioWorklet (audio-worklet.js): the SPU's frames are transferred to the
    // rendering thread, which plays them and reports what it still holds. The deprecated
    // ScriptProcessorNode remains only as a fallback for a browser without worklets.
    let audioNode = null;
    // The worklet reports its queue every 23 ms or so and the SPU asks far more often; between
    // reports the answer is the last report less what the rendering thread has consumed since,
    // at 44.1 frames a millisecond, plus what was pushed in the meantime.
    let reportedFrames = 0, reportedAt = 0, pushedSinceReport = 0;
    // Batches pushed during one tick travel to the worklet in one message at the tick's end
    // (from `progress`): the SPU pushes 344 times a second and a message each cost more than
    // the sound. A tick's worth is under 16 ms of audio, well inside the queue's slack.
    const audioPending = [];
    let audioPendingSamples = 0;
    function flushAudio() {
      if (!audioNode || audioPending.length === 0) return;
      const merged = new Int16Array(audioPendingSamples);
      let at = 0;
      for (const chunk of audioPending) { merged.set(chunk, at); at += chunk.length; }
      audioPending.length = 0; audioPendingSamples = 0;
      audioNode.port.postMessage(merged.buffer, [merged.buffer]);
    }
    // The status line is DOM: written per tick it forced a layout each time (2 % of a frame in
    // the profile, and as much again in layout). Four times a second is plenty to read.
    let shownFrames = -15;
    let shownAt = 0;
    let presentedAt = 0;
    function workletBuffered() {
      const drained = (performance.now() - reportedAt) * 44.1;
      return Math.max(0, Math.round(reportedFrames - drained + pushedSinceReport));
    }
    async function startAudio() {
      audioContext = new AudioContext({ sampleRate: 44100, latencyHint: 'interactive' });
      if (audioContext.audioWorklet) {
        try {
          await audioContext.audioWorklet.addModule('audio-worklet.js');
          audioNode = new AudioWorkletNode(audioContext, 'recompsx-audio',
            { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2] });
          audioNode.port.onmessage = event => {
            reportedFrames = event.data; reportedAt = performance.now(); pushedSinceReport = 0;
          };
          audioNode.connect(audioContext.destination);
          return;
        } catch (error) {
          writeLog(`[audio] worklet failed to load (${error.message}); using ScriptProcessorNode`);
          audioNode = null;
        }
      }
      const node = audioContext.createScriptProcessor(2048, 0, 2);
      node.onaudioprocess = event => {
        const left = event.outputBuffer.getChannelData(0);
        const right = event.outputBuffer.getChannelData(1);
        left.fill(0); right.fill(0);
        let at = 0;
        while (at < left.length && audioQueue.length) {
          const item = audioQueue[0];
          const available = item.frames - item.at;
          const take = Math.min(left.length - at, available);
          for (let i = 0; i < take; i++) {
            left[at + i] = item.samples[(item.at + i) * 2] / 32768;
            right[at + i] = item.samples[(item.at + i) * 2 + 1] / 32768;
          }
          item.at += take; at += take; queuedFrames -= take;
          if (item.at === item.frames) audioQueue.shift();
        }
      };
      node.connect(audioContext.destination);
    }

    start.addEventListener('click', async () => {
      if (globalThis.recompsxHost) {
        const host = globalThis.recompsxHost;
        host.paused = !host.paused;
        start.textContent = host.paused ? 'Resume' : 'Pause';
        if (host.paused) {
          audioQueue.length = 0; queuedFrames = 0;
          audioPending.length = 0; audioPendingSamples = 0;
          reportedFrames = 0; reportedAt = performance.now(); pushedSinceReport = 0;
          if (audioNode) audioNode.port.postMessage('flush');
        }
        status.textContent = host.paused ? 'Paused' : 'Resuming…';
        return;
      }
      start.disabled = true;
      try {
        if (!buildInfo) {
          const response = await fetch('build.json', { cache: 'no-store' });
          if (!response.ok) throw new Error('No browser build found.');
          buildInfo = await response.json();
        }
        // Off, the SPU still advances every voice (a game reads ENDX and the envelopes) but
        // mixes nothing and no AudioContext is created — the runtime is told with --no-audio.
        audioBox.disabled = true;
        if (audioBox.checked) await startAudio();
        const boot = await fetchBytes('boot.exe', 'PS-EXE');
        const disc = await fetchBytes('disc.bin', 'disc image');
        status.textContent = 'Starting the game…';

        hwBox.disabled = true;
        if (hwBox.checked) {
          try { renderer = createHardwareGpu(glCanvas); }
          catch (error) { writeLog(`[webgl] ${error.message}; falling back to software rendering`); renderer = null; }
        }
        if (renderer) { canvas.hidden = true; glCanvas.hidden = false; }

        globalThis.recompsxHost = {
          args: ['boot.exe', 'disc.bin']
            .concat(renderer ? ['--video-hw'] : [])
            .concat(audioContext ? [] : ['--no-audio']),
          files: { 'boot.exe': boot, 'disc.bin': disc },
          paused: false,
          unpaced: !paceBox.checked,
          gpu: renderer,
          present(vram, sx, sy, width, height, flags) {
            // Fast-forwarding, every emulated vblank still arrives here; one picture per display
            // interval is all a viewer can see, so the rest are skipped before any blit.
            if (this.unpaced) {
              const now = performance.now();
              if (now - presentedAt < 15) return;
              presentedAt = now;
            }
            if (renderer) { renderer.present(vram, sx, sy, width, height, flags); return; }
            if (width <= 0 || height <= 0) {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              return;
            }
            if (!image || image.width !== width || image.height !== height) {
              frame.width = width; frame.height = height;
              image = frameCtx.createImageData(width, height);
            }
            const rgba = image.data;
            const rgb24 = (flags & 1) !== 0;
            let out = 0;
            for (let y = 0; y < height; y++) {
              const row = ((sy + y) & 511) * 2048;
              for (let x = 0; x < width; x++) {
                const at = (sx * 2 + x * (rgb24 ? 3 : 2)) & 2047;
                if (rgb24) {
                  rgba[out++] = vram[row + at];
                  rgba[out++] = vram[row + ((at + 1) & 2047)];
                  rgba[out++] = vram[row + ((at + 2) & 2047)];
                } else {
                  const v = vram[row + at] | (vram[row + ((at + 1) & 2047)] << 8);
                  const r = v & 31, g = (v >> 5) & 31, b = (v >> 10) & 31;
                  rgba[out++] = (r << 3) | (r >> 2);
                  rgba[out++] = (g << 3) | (g >> 2);
                  rgba[out++] = (b << 3) | (b >> 2);
                }
                rgba[out++] = 255;
              }
            }
            frameCtx.putImageData(image, 0, 0);
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);
          },
          audioPush(bytes) {
            if (!audioContext) return;
            const samples = new Int16Array(bytes.buffer, bytes.byteOffset, bytes.byteLength >> 1);
            const copy = new Int16Array(samples);
            const frames = copy.length >> 1;
            if (audioNode) {
              audioPending.push(copy);
              audioPendingSamples += copy.length;
              pushedSinceReport += frames;
              return;
            }
            audioQueue.push({ samples: copy, frames, at: 0 });
            queuedFrames += frames;
            while (queuedFrames > 11025 && audioQueue.length > 1) {
              const dropped = audioQueue.shift();
              queuedFrames -= dropped.frames - dropped.at;
            }
          },
          audioBuffered() { return audioNode ? workletBuffered() : (audioContext ? queuedFrames : 0); },
          state(value) {
            start.disabled = value !== 'running';
            start.textContent = value === 'running' ? 'Pause' : 'Start game';
            if (value === 'error') status.textContent = 'The game stopped with an error; details are in the browser console.';
            else if (value === 'stopped') status.textContent = 'The game stopped.';
          },
          progress(frames, yields) {
            flushAudio();
            // At most twice a second, whatever the frame rate: a status write re-lays the page.
            const now = performance.now();
            if (now - shownAt < 500) return;
            const fps = shownAt > 0 ? Math.round((frames - shownFrames) * 1000 / (now - shownAt)) : 0;
            shownAt = now; shownFrames = frames;
            status.textContent = `${frames} frames · ${fps} fps · running`;
            status.dataset.frames = frames;
            status.dataset.yields = yields;
          },
          log(level, line) { writeLog(line); },
          storageWrite(name, bytes) { writeLog(`[file] ${name}: ${bytes.length} bytes`); }
        };
        const script = document.createElement('script');
        script.src = `game.js?v=${encodeURIComponent(buildInfo.version)}`;
        script.onerror = () => {
          status.textContent = 'Error: could not load game.js';
          start.disabled = false;
        };
        document.body.appendChild(script);
      } catch (error) {
        status.textContent = `Error: ${error.message}`;
        writeLog(error.stack || String(error));
        start.disabled = false;
      }
    });
  </script>
</body>
</html>
